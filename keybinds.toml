# Keybinds (https://docs.noctalia.dev/umbriel/keybinds) --------------------------------------

[keybinds]
"Mod+Shift+O" = "cheatsheet-toggle"
"Mod+Q"       = "window-close"
"Mod+O"       = "overview-toggle"
"Mod+T"       = "window-toggle-floating"
"Mod+Shift+T" = "window-focus-switch-floating"
"Mod+P"       = "window-toggle-pinned"

#[Moving around]
"Mod+Alt+1"        = "workspace-switch:MAIN"
"Mod+Alt+2"        = "workspace-switch:STORAGE"
"Mod+Alt+3"        = "workspace-switch:CHAT"
"Mod+Alt+4"        = "workspace-switch:HIDDEN"
"Mod+GRAVE"        = "spawn:~/.config/umbriel/scripts/swapMonitors.sh"
"Mod+MouseMiddle"  = "layout-scroll-drag"
"Mod+MouseForward" = "workspace-previous"
"Mod+MouseBack"    = "workspace-next"
"Mod+Bracketright" = "window-focus-next"
"Mod+Bracketleft"  = "window-focus-previous"
"Mod+Left"         = "window-focus-or-output-left"
"Mod+Right"        = "window-focus-or-output-right"
"Mod+Up"           = "workspace-previous"
"Mod+Down"         = "workspace-next"
"Mod+Shift+Left"   = "column-move-left"
"Mod+Shift+Right"  = "column-move-right"
"Mod+Shift+Up"     = "workspace-previous"
"Mod+Shift+Down"   = "workspace-next"

#[Window Widths]
"Mod+1"         = "window-set-primary-extent:0.75"
"Mod+2"         = "window-set-primary-extent:0.50"
"Mod+3"         = "window-set-primary-extent:0.333"
"Mod+4"         = "window-set-primary-extent:0.25"
"Mod+5"         = "window-set-primary-extent:1.00"
"Mod+WheelUp"   = "window-cycle-primary-extent"
"Mod+WheelDown" = "window-cycle-primary-extent-back"
"Mod+F"         = "window-toggle-fullscreen"
"Mod+Shift+R"   = "window-cycle-primary-extent"
"Mod+R"         = "window-toggle-maximize"

#[Applications]
"Mod+X" = "spawn:kitty"
"Mod+E" = "spawn:nautilus"
"Mod+B" = "spawn:helium-browser"
"Mod+D" = "spawn:vesktop"
"Mod+Z" = "spawn:zeditor"
"Mod+Alt+B" = "spawn:~/.config/umbriel/scripts/focus-app.sh app 'helium'"

#[Noctalia panels/menus]
"Mod+Space"   = "spawn:noctalia msg panel-toggle launcher"
"Mod+Escape"  = "spawn:noctalia msg panel-toggle session"
"Mod+W"       = "spawn:noctalia msg panel-toggle noctalia/wallhaven:browser"
"Mod+N"       = "spawn:noctalia msg panel-toggle ahmedhossamdev/sticky-notes:panel"
"Mod+V"       = "spawn:noctalia msg panel-toggle clipboard"
"Mod+S"       = "spawn:noctalia msg screenshot-region"
"Mod+Shift+S" = "spawn:noctalia msg annotate"
"Mod+Comma"   = "spawn:noctalia msg settings-toggle"
"Mod+Tab"     = "spawn:noctalia msg window-switcher"

#[Volume/Audio]
"XF86AudioRaiseVolume" = "spawn:noctalia msg volume-up"
"XF86AudioLowerVolume" = "spawn:noctalia msg volume-down"
"XF86AudioMute"        = "spawn:noctalia msg volume-mute"
"XF86VoiceCommand"     = "spawn:noctalia msg mic-mute"
"XF86AudioPlay"        = "spawn:noctalia msg media toggle"
"XF86AudioNext"        = "spawn:noctalia msg media next"
"XF86AudioPrev"        = "spawn:noctalia msg media previous"
