# Animation ------------------------------------------------------------------

[animation]
enabled = true
duration_ms = 150
curve = "easeout"

#[animation.windows_in]
#duration_ms = 150
#shader = "shaders/fade-open.glsl"

[animation.windows_out]
duration_ms = 350
shader = "shaders/pixelate-close.glsl"

[animation.windows_in]
enabled = false
curve = "spring:1,100"
style = "popin"
scale = 0.5

[animation.windows_move]
enabled = true
curve = "spring:1,900"

[animation.workspaces]
enabled = true
curve = "spring:1,800"

#[animation.overview]
#enabled = true
#duration_ms = 450
#curve = "easeout"

[animation.overview]
enabled = true
duration_ms = 750
shader = "shaders/overexposure-open.glsl"

[animation.scratchpad]
enabled = true
curve = "spring:1,800"
dim = 0.8
blur = false
scale = 0.0
maximize = false
fullscreen = false

[animation.border]
enabled = true
duration_ms = 350
shader = "shaders/border-pulse.glsl"

[animation.dim_unfocused]
enabled = false
duration_ms = 1000
curve = "easeout"
dim = 0.1

# Appearance -----------------------------------------------------------------

[appearance]
prefer_no_csd = true
border_width = 3
outer_border_width = 0
corner_radius = 16
drag_opacity = 0.75

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 2
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[appearance.shadow]
enabled = true
softness = 2
offset_x = 0
offset_y = 0
