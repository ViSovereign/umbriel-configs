# "Mod+Ctrl+0" = "window-restore-from-scratchpad:DP-1"
# "Mod+Alt+0" = "scratchpad-focus-next:DP-1"
# "Mod+Space" is taken above; pick a free chord for layout switching.
# "Mod+Shift+K" = "keyboard-layout-next"
# Drag a scrolling workspace directly along its configured axis.
# Submaps can nest; entry binds should not repeat. Inspect the active layer with `umbriel submap`.
# "Mod+R" = { action = "submap:resize", repeat = false }
# Omit `submap` to add no post-action transition, or set it to "reset" to exit after the action.
# "submap[resize],1" = { action = "window-set-width:0.5", submap = "reset" }
# "submap[resize],Escape" = "submap:reset"

