# Animation ------------------------------------------------------------------

[include]
files = [
    "shaders/community/border/pulse/effect.toml",
    "shaders/community/window/rainfall/effect.toml",
    "shaders/community/animation/vhs/effect.toml",
    "shaders/animation/beam/effect.toml"
]

[effects]
#window = "window.rainfall"
border = "pulse"

[animation]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.windows_in]
enabled = true
effect = "beam"
duration_ms = 550
curve = "linear"

[animation.windows_out]
enabled = true
effect = "beam"
duration_ms = 350
curve = "linear"

#[animation.windows_in]
#enabled = true
#curve = "spring:1,900"
#style = "popin"
#scale = 0.5

#[animation.windows_out]
#enabled = true
#curve = "spring:1,1400"
#style = "popin"
#scale = 0.8

[animation.windows_move]
enabled = true
curve = "spring:1,900"

[animation.workspaces]
enabled = true
curve = "spring:1,800"

[animation.overview]
enabled = true
curve = "spring:1,800"
workspace_curve = "spring:1,1000"

[animation.scratchpad]
enabled = true
curve = "spring:1,800"
dim = 0.8
blur = false
scale = 0.0
maximize = false
fullscreen = false

[animation.border]
enabled = false
curve = "spring:1,900"

[animation.dim_unfocused]
enabled = false
dim = 0.0

[animation.layers]
enabled = false

# Appearance -----------------------------------------------------------------

[appearance]
prefer_no_csd = true
border_width = 3
outer_border_width = 0
corner_radius = 16
drag_opacity = 0.75

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 2
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[appearance.shadow]
enabled = true
softness = 2
offset_x = 0
offset_y = 0
