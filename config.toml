[include]
files = ["env.toml", "outputs.toml", "input.toml", "appearance.toml", "layer_rules.toml", "keybinds.toml" , "window_rules.toml", "security.toml"]

[general]
autostart = ["noctalia"]
# mod_key = "Super"            # Mod in keybinds; defaults to Super (Alt when nested)
xwayland = true                # requires restart to change
show_cheatsheet = true         # show keybinds overlay on startup
focus_on_activate = false      # unsolicited requests cannot add focus; trusted launches may still focus
honor_restored_maximize = false # let apps restore their saved maximized state

# [events]
# lid_close = "notify-send 'The laptop lid is closed!'"
# lid_open = "notify-send 'The laptop lid is open!'"

[workspaces]
back_and_forth = false
empty_above = false

[[scratchpad]]
name = "terminal"

# Overview -------------------------------------------------------------------

[overview]
zoom = 0.55                     # 0.1-0.75
scroll_factor_horizontal = 1.0 # 0.1-10.0
scroll_factor_vertical = 1.0   # 0.1-10.0
background_blur = true
workspace_wallpaper = true
shortcuts = true
#shortcut_keys = "1234567890"

# Hot corners ---------------------------------------------------------------

[hot_corners.top_left]
enabled = false
delay_ms = 500
action = "overview-open"

[hot_corners.top_right]
enabled = true
delay_ms = 100
action = "overview-toggle"

[hot_corners.bottom_left]
enabled = false
delay_ms = 500
action = "overview-toggle"

[hot_corners.bottom_right]
enabled = true
delay_ms = 100
action = "overview-toggle"

# Layout ---------------------------------------------------------------------

[layout]
mode = "scrolling"             # "scrolling", "dwindle", or "master"
gap = 5
extent_presets = [0.25, 0.333, 0.5, 0.667, 0.75, 1.0]

[layout.scrolling]
default_extent_fraction = 0.5  # remove to let clients choose their initial width
center_underfull_strip = true  # center the strip whenever it is narrower than the viewport
center_focused = "never" # always center the focused column

[layout.dwindle]
preserve_split = false

[layout.master]
position = "left"
default_width_fraction = 0.60
new_on_top = true
new_becomes_master = true

[[workspace]]
name = "MAIN"
layout.mode = "scrolling"
layout.struts.left = 5
layout.struts.right = 5

[[workspace]]
name = "STORAGE"
layout.mode = "scrolling"
layout.struts.left = 5
layout.struts.right = 5

[[workspace]]
name = "CHAT"
layout.mode = "scrolling"
layout.struts.top = 5
layout.struts.bottom = 5

[[workspace]]
name = "HIDDEN"
layout.mode = "scrolling"
layout.struts.top = 5
layout.struts.bottom = 5

[include.optional]
files = ["noctalia.toml"]
