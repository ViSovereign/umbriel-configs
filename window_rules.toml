# Window rules (see docs/user/window-rules.md) ---------------------------

# Blur all windows
[[window_rule]]
blur = true
blur_optimized = false

# When a window is not focused, let some light shine through
[[window_rule]]
match.is_focused = false
opacity = 0.92

# Open vesktop on DP-2
[[window_rule]]
match.app_id = "^vesktop$"
default_output = "DP-2"

# Do you play games?
[[window_rule]]
match.content_type = "game"
default_fullscreen = true

[[window_rule]]
match.xdg_tag = "^proton-game$"
default_fullscreen = true

[[window_rule]]
match.xdg_tag = "^steam$"
default_fullscreen = false
default_output = "DP-1"

# Noctalia gets floating
[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_size = [1020, 900]

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_size = [800, 600]

# Floating file explorer
[[window_rule]]
match.app_id = "^org[.]gnome[.]Nautilus$"
default_floating = true
default_size = [1000, 1000]

# Need some PiP?
[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# Size a float as fractions of the usable area instead of pixels, so the rule
# suits any monitor. default_size wins on both axes when it is also set.
